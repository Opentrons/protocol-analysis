name: Cache Analysis Venvs
description: Restore the analysis virtualenvs under .venvs/

runs:
  using: composite
  steps:
    - name: Restore .venvs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .venvs
        key: >-
          venvs-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'evaluate/env_config.py') }}
        restore-keys: |
          venvs-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'evaluate/env_config.py') }}-
          venvs-${{ runner.os }}-py3.12-
