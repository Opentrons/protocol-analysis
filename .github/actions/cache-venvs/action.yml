name: Cache Analysis Venvs
description: Restore and save the analysis virtualenvs under .venvs/

runs:
  using: composite
  steps:
    - name: Cache .venvs
      uses: actions/cache@v4
      with:
        path: |
          .venvs
        key: >-
          venvs-${{ runner.os }}-${{ hashFiles('evaluate/env_config.py') }}
        restore-keys: |
          venvs-${{ runner.os }}-
