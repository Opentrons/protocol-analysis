name: Cache Analysis Venvs (Save)
description: Save the analysis virtualenvs under .venvs/

runs:
  using: composite
  steps:
    - name: Save .venvs
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .venvs
        key: >-
          venvs-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'evaluate/env_config.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
