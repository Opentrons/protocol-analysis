[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "protocol-evaluation"
version = "0.1.0"
description = "Standalone Opentrons protocol analysis and evaluation engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Opentrons", email = "engineering@opentrons.com" }]
dependencies = [
    "fastapi[standard]>=0.121.3",
    "python-multipart>=0.0.20",
]

[project.urls]
Repository = "https://github.com/Opentrons/protocol-evaluation"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "evaluate", "client"]

[tool.hatch.build.targets.sdist]
include = [
    "/api",
    "/evaluate",
    "/client",
    "/run_processor.py",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["test-files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
show_error_codes = true
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["test-files/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit tests",
    "integration: API tests using TestClient without live services",
    "e2e: end-to-end tests requiring API and processor services",
    "slow: tests that download or build Opentrons environments",
]
